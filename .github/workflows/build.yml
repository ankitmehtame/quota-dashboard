name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 19:00 UTC on the previous day is 03:00 SGT.
    # Run on the possible UTC dates, then gate to the actual Singapore 1st.
    - cron: "0 19 28-31 * *"

permissions:
  contents: read

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check-date.outputs.should-run }}
    steps:
      - id: check-date
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "$(TZ=Asia/Singapore date +%d)" == "01" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Test
        working-directory: src
        run: npm test

      - name: Build runtime artifact
        working-directory: src
        run: npm run build

      - name: Smoke-test runtime artifact
        working-directory: src/dist
        run: |
          node server.js > "$RUNNER_TEMP/quota-dashboard-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/quota-dashboard-server.log"
          exit 1

      - name: Upload Node.js artifact
        uses: actions/upload-artifact@v4
        with:
          name: quota-dashboard-node
          path: src/dist
          if-no-files-found: error
          retention-days: 14

name: Build

on:
  push:
    branches-ignore:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC; this is approximately 03:00 SGT.
    - cron: "0 19 1 * *"

permissions:
  contents: read

jobs:
  build:
    outputs:
      prerelease: ${{ steps.release_channel.outputs.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release channel
        id: release_channel
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if git merge-base --is-ancestor HEAD "origin/main"; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Test
        working-directory: src
        run: npm test

      - name: Build runtime artifact
        working-directory: src
        run: npm run build

      - name: Install runtime dependencies in artifact
        working-directory: src/dist
        run: npm ci --omit=dev --ignore-scripts

      - name: Smoke-test runtime artifact
        working-directory: src/dist
        run: |
          node server.js > "$RUNNER_TEMP/quota-dashboard-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/quota-dashboard-server.log"
          exit 1

      - name: Package remote agent archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            remote_version="$GITHUB_REF_NAME"
          else
            remote_version="ci-$GITHUB_SHA"
          fi
          node scripts/package-remote-agent.mjs "$remote_version"
          echo "REMOTE_AGENT_ARCHIVE=quota-dashboard-remote-agent-$remote_version.tar.gz" >> "$GITHUB_ENV"

      - name: Smoke-test remote agent archive
        run: node scripts/smoke-test-remote-agent.mjs "$REMOTE_AGENT_ARCHIVE"

      - name: Upload Node.js artifact
        uses: actions/upload-artifact@v6
        with:
          name: quota-dashboard-node
          path: src/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload remote agent artifact
        uses: actions/upload-artifact@v6
        with:
          name: quota-dashboard-remote-agent
          path: ${{ env.REMOTE_AGENT_ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -czf "quota-dashboard-node-${GITHUB_REF_NAME}.tar.gz" -C src/dist .

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: quota-dashboard-release
          path: |
            quota-dashboard-node-${{ github.ref_name }}.tar.gz
            quota-dashboard-remote-agent-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archive
        uses: actions/download-artifact@v7
        with:
          name: quota-dashboard-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            quota-dashboard-node-${{ github.ref_name }}.tar.gz
            quota-dashboard-remote-agent-${{ github.ref_name }}.tar.gz

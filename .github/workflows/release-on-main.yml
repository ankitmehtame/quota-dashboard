name: Release Main

on:
  push:
    branches:
      - main

# Ensure concurrent merges receive distinct version numbers.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Test
        working-directory: src
        run: npm test

      - name: Build runtime artifact
        working-directory: src
        run: npm run build

      - name: Smoke-test runtime artifact
        working-directory: src/dist
        run: |
          node server.js > "$RUNNER_TEMP/quota-dashboard-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/quota-dashboard-server.log"
          exit 1

      - name: Create next minor version tag
        id: release_tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          existing_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              existing_tag="$candidate"
              break
            fi
          done < <(git tag --points-at "$COMMIT_SHA" --list 'v*.*.*' --sort=-v:refname)

          if [[ -n "$existing_tag" ]]; then
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "Commit $COMMIT_SHA is already tagged as $existing_tag."
            exit 0
          fi

          latest_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              latest_tag="$candidate"
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              break
            fi
          done < <(git tag --list 'v*.*.*' --sort=-v:refname)

          latest_tag="${latest_tag:-v0.0.0}"
          next_tag="v${major:-0}.$((minor + 1)).0"

          if git show-ref --tags --verify --quiet "refs/tags/$next_tag"; then
            echo "Tag $next_tag already exists on another commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next_tag" "$COMMIT_SHA" --message "Release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "Created and pushed $next_tag"

      # Rebuild after tagging so version.json contains the release version.
      - name: Build tagged runtime artifact
        working-directory: src
        run: npm run build

      - name: Package release archive
        run: tar -czf "quota-dashboard-node-${{ steps.release_tag.outputs.tag }}.tar.gz" -C src/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: quota-dashboard-node-${{ steps.release_tag.outputs.tag }}.tar.gz
